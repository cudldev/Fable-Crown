<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body><header><h1 id="title">Actual native VOX review</h1><div>6.25cm cubic pitch · 1m grid · shared world scale</div><button id="native">Native VOX</button><button id="source">Actual TRELLIS mesh</button><button id="unlit">Unlit colors</button></header><footer id="stats"></footer>
